# docker compose up --build   ->  dashboard on http://localhost:8080
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      SOAR_DRY_RUN: "true"
    ports:
      - "8001:8001"
    volumes:
      - dnsentinel-data:/app/var
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dnsentinel-data:
